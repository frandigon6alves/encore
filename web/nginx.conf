server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS. With a variable in proxy_pass nginx re-resolves "api" at runtime;
    # a literal host is resolved once at startup and breaks (502) when the api container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location ~ ^/(api|graphql)(/|$) {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
